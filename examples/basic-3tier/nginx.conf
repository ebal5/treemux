server {
    listen 80;

    location / {
        return 200 'treemux example - web service running!\n';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://api:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
