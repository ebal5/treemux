services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: kennethreitz/httpbin
    ports:
      - "5000:80"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: treemux
      POSTGRES_PASSWORD: treemux
      POSTGRES_DB: treemux
