name: Lint

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  pull-requests: write

env:
  REVIEWDOG_VERSION: v0.20.3

jobs:
  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v6.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin ${{ env.REVIEWDOG_VERSION }}

      - name: Run ruff check with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ruff check --output-format=rdjson . | \
            ./bin/reviewdog -f=rdjson \
              -name="ruff-lint" \
              -reporter=github-pr-review \
              -fail-level=warning

  ruff-format:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v6.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin ${{ env.REVIEWDOG_VERSION }}

      - name: Run ruff format check with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ruff format --check --diff . | \
            ./bin/reviewdog -f=diff \
              -name="ruff-format" \
              -reporter=github-pr-review \
              -fail-level=warning \
              -f.diff.strip=1
